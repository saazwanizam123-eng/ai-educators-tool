<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindaInklusif AI — Special Needs Learning Portal</title>
  <style>
    /* ==========================================================================
       LIQUID GLASS DESIGN SYSTEM & ACCESSIBILITY STYLES
       ========================================================================== */
    :root {
      --glass-bg: rgba(15, 23, 42, 0.45); /* Darkened slightly so text stays readable */
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-main: #ffffff;
      --accent-teal: #0d9488;
      --accent-glow: rgba(13, 148, 136, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* BACKGROUND IMAGE APPLIED HERE */
    body {
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('bg1.jpg') center/cover no-repeat fixed;
      color: #f8fafc;
      padding: 20px;
    }

    /* Container Glass Card */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
      padding: 30px;
    }

    /* Heading with Image Fill & Glow */
    .image-heading {
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      display: inline-block;
      background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=80') center/cover;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
      cursor: pointer;
    }

    .image-heading:hover {
      transform: scale(1.05) translateY(-3px);
      filter: drop-shadow(0 0 15px var(--accent-glow)) drop-shadow(0 0 30px rgba(255, 255, 255, 0.8));
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 30px 0 15px 0;
      background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=80') center/cover;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .section-title:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    .interactive-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .interactive-btn:hover {
      transform: scale(1.08) translateY(-2px);
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 20px var(--accent-glow), 0 0 10px rgba(255, 255, 255, 0.5);
      border-color: #ffffff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-top: 20px;
    }

    @media (max-width: 850px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .glass-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .ithink-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .ithink-btn {
      padding: 10px;
      font-size: 0.85rem;
      text-align: center;
      justify-content: center;
    }

    .mindmap-canvas {
      width: 100%;
      height: 280px;
      background: rgba(15, 23, 42, 0.7);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .map-node {
      background: rgba(13, 148, 136, 0.8);
      border: 2px solid #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: 380px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
      margin-bottom: 15px;
    }

    .chat-msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .chat-msg.ai {
      background: rgba(13, 148, 136, 0.6);
      border: 1px solid rgba(13, 148, 136, 0.8);
      align-self: flex-start;
    }

    .chat-msg.user {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      align-self: flex-end;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent-teal);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .accessibility-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="image-heading">MindaInklusif AI</h1>
    <p style="margin-top: -10px; opacity: 0.9;">Empowering Special Needs Education with Visual Mind Mapping & AI Support</p>

    <div class="accessibility-bar" style="margin-top: 15px;">
      <button class="interactive-btn" onclick="toggleSpeech()">🔊 Text-to-Speech</button>
      <button class="interactive-btn" onclick="adjustFontSize(1)">A+ Text Size</button>
      <button class="interactive-btn" onclick="adjustFontSize(-1)">A- Text Size</button>
    </div>

    <div class="grid-2">
      <div class="glass-card">
        <h2 class="section-title">Peta Minda i-Think</h2>
        <div class="ithink-grid">
          <button class="interactive-btn ithink-btn" onclick="renderMap('Bulatan')">Peta Bulatan</button>
          <button class="interactive-btn ithink-btn" onclick="renderMap('Buih')">Peta Buih</button>
          <button class="interactive-btn ithink-btn" onclick="renderMap('Alir')">Peta Alir</button>
        </div>
        <div class="mindmap-canvas" id="canvas">
          <div class="map-node">Select an i-Think Map above</div>
        </div>
      </div>

      <div class="glass-card">
        <h2 class="section-title">Pembantu AI Mesra</h2>
        <div class="chat-box">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai">
              👋 High! I am your AI learning companion. Ask me to simplify any lesson!
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" class="chat-input" id="userInput" placeholder="Type or ask a simple question..." onkeypress="handleKey(event)">
            <button class="interactive-btn" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function renderMap(type) {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = `<div class="map-node">[ ${type} Visual Layout Loaded ]</div>`;
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const messages = document.getElementById('chatMessages');
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'chat-msg user';
      userMsg.innerText = text;
      messages.appendChild(userMsg);

      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'chat-msg ai';
        aiMsg.innerText = "Great question! Let's break this down step-by-step together.";
        messages.appendChild(aiMsg);
        messages.scrollTop = messages.scrollHeight;
      }, 600);
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    let currentFontSize = 100;
    function adjustFontSize(delta) {
      currentFontSize += delta * 10;
      document.body.style.fontSize = currentFontSize + '%';
    }

    function toggleSpeech() {
      const textToRead = "Welcome to Minda Inklusif AI.";
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
